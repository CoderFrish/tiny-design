name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**/*.md'
      - '.github/workflows/DeployToPages.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: |
        npm install -g pnpm
        pnpm install --frozen-lockfile

    - name: Build project
      run: pnpm build:docs

    - name: Deploy to Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/.vitepress/dist
        force_orphan: true